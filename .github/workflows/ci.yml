name: Verificacao do projeto
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Atualizar npm (corrige erro edgesOut)
        run: |
          npm install --global npm@11.6.0
          node --version
          npm --version
      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Testar regras de negocio
        run: npm test
      - name: Compilar Angular
        run: npm run build
